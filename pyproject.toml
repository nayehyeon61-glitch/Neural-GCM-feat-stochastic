[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "neuralgcm-manifold-memory"
version = "0.3.0"
description = "Spatial statistical memory and stochastic residual closure for NeuralGCM"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "jax>=0.4.35", "numpy>=1.26", "optax>=0.2.3",
  "neuralgcm==1.2.2", "dinosaur==1.5.0", "xarray>=2024.1", "scipy>=1.12",
]

[project.optional-dependencies]
test = ["pytest>=8"]
export = ["torch>=2.2"]
netcdf = ["h5netcdf>=1.3", "netCDF4>=1.6"]
kai = ["torch>=2.6", "h5netcdf>=1.3", "netCDF4>=1.6", "ruamel.yaml>=0.18"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools]
license-files = ["THIRD_PARTY_NOTICES.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["integration: runs the real NeuralGCM model and may compile slowly"]
